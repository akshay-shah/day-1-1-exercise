name: Export question bank
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/export-bank.mjs
      - name: Commit generated bank if changed
        run: |
          if [ -z "$(git status --porcelain -- questions.json)" ]; then
            echo "questions.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions.json
          git commit -m "Generate 200-question CCA-F bank"
          git push
