<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="color-scheme" content="dark">
  <title>CCA-F Practice Bank</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="sticky-shell">
      <div class="brand-row">
        <div>
          <div class="eyebrow">CCA-F / CCAR-F</div>
          <h1>Architect Foundations</h1>
        </div>
        <button id="resetAllBtn" class="icon-button" type="button" aria-label="Reset all progress" title="Reset all progress">↻</button>
      </div>
      <div class="filters" aria-label="Question filters">
        <label><span>Mode</span><select id="modeFilter"><option value="study">Study</option><option value="review">Review answered</option><option value="flagged">Solve later</option><option value="all">All questions</option></select></label>
        <label><span>Domain</span><select id="domainFilter"><option value="all">All domains</option></select></label>
        <label><span>Difficulty</span><select id="difficultyFilter"><option value="all">All levels</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
        <label><span>Section</span><select id="sectionFilter"><option value="all">All sections</option></select></label>
      </div>
      <div class="status-row">
        <div class="metric"><strong id="answeredMetric">0</strong><span>Answered</span></div>
        <div class="metric"><strong id="flaggedMetric">0</strong><span>Later</span></div>
        <div class="metric"><strong id="remainingMetric">200</strong><span>Remaining</span></div>
        <div class="metric"><strong id="scoreMetric">0%</strong><span>Score</span></div>
      </div>
      <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    </header>
    <main class="deck-wrap">
      <section id="emptyState" class="empty-state hidden" aria-live="polite">
        <h2>No cards in this view</h2>
        <p>Change a filter, review answered cards, or open your Solve Later queue.</p>
      </section>
      <article id="card" class="question-card" aria-live="polite">
        <div class="card-head">
          <div class="chips"><span id="domainChip" class="chip primary"></span><span id="difficultyChip" class="chip"></span><span id="sourceChip" class="chip"></span></div>
          <div id="questionCounter" class="question-counter"></div>
        </div>
        <div class="section-name" id="sectionName"></div>
        <h2 id="questionText"></h2>
        <fieldset id="optionsFieldset" class="options"><legend class="sr-only">Choose one answer</legend></fieldset>
        <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>
      </article>
      <div class="swipe-hint" aria-hidden="true"><span>← Solve later</span><span>Swipe card</span><span>Submit →</span></div>
      <div class="controls">
        <button id="laterBtn" class="button secondary" type="button">← Solve later</button>
        <button id="retakeFlaggedBtn" class="button tertiary hidden" type="button">Retake flagged</button>
        <button id="submitBtn" class="button primary" type="button">Submit →</button>
      </div>
      <p id="progressText" class="progress-text"></p>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
